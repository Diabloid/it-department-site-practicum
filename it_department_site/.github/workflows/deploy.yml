name: Build, Push & Deploy

on:
  push:
    # tags:
    #   - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        options:
          - qa
          - staging
        default: qa

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # temporary: any push -> QA
            echo "env=qa" >> $GITHUB_OUTPUT
            echo "tag=qa" >> $GITHUB_OUTPUT
          else
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose -f Docker/docker-compose.yml build

      - name: Push images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose -f Docker/docker-compose.yml push


  deploy-qa:
    needs: build
    if: needs.build.outputs.env == 'qa'
    runs-on: [self-hosted, qa]
    environment: qa

    steps:
      - name: Write env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.QA_ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE_CONTENT" > /opt/ipz_site/.env
          chmod 600 /opt/ipz_site/.env

      - name: Deploy QA
        env:
          IMAGE_TAG: qa
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd /opt/ipz_site
          docker-compose down
          docker-compose pull
          docker-compose up -d


  deploy-staging:
    needs: build
    if: needs.build.outputs.env == 'staging'
    runs-on: [self-hosted, staging]
    environment: staging

    steps:
      - name: Write env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.QA_STAGING_FILE }}
        run: |
          printf '%s' "$ENV_FILE_CONTENT" > /opt/ipz_site/.env
          chmod 600 /opt/ipz_site/.env

      - name: Deploy Staging
        env:
          IMAGE_TAG: staging
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd /opt/ipz_site
          docker-compose down
          docker-compose pull
          docker-compose up -d


  deploy-production:
    needs: build
    if: needs.build.outputs.env == 'production'
    runs-on: [self-hosted, production]
    environment: production

    steps:
      - name: Write env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE_CONTENT" > /opt/ipz_site/.env
          chmod 600 /opt/ipz_site/.env

      - name: Deploy Production
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd /opt/ipz_site
          docker-compose down
          docker-compose pull
          docker-compose up -d
