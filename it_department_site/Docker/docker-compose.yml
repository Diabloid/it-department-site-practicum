services:
  db:
    image: mysql:latest
    container_name: ipz_db
    restart: always
    env_file:
      - .env
    volumes:
      - ./ipz_db:/var/lib/mysql
    networks: [ipz_net]

  ipz-site:
    env_file:
      - .env
    #image: ghcr.io/${GITHUB_REPOSITORY}/ipz-site:${IMAGE_TAG}
    image: ipz-site
    restart: on-failure:5
    ports: "8080:8080"
    volumes:
      - ./secrets:/app/secrets:ro
    networks: [ipz_net]

networks:
  ipz_net:
    driver: bridge
